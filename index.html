<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceefa">
  <meta name="description" content="Marketplace &amp; Auction House of Brooklyn New York. Curator-led physical and digital art.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:title" content="Marketplace &amp; Auction House of Brooklyn New York">
  <meta property="og:description" content="Curator-led physical and digital art in Brooklyn.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://the-school-omega.vercel.app/">
  <meta property="og:image" content="https://the-school-omega.vercel.app/public/assets/school-seed.jpg">
  <meta property="og:image:alt" content="A glowing ornate school floating in pale-blue clouds">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marketplace &amp; Auction House of Brooklyn New York">
  <meta name="twitter:description" content="Curator-led physical and digital art in Brooklyn.">
  <meta name="twitter:image" content="https://the-school-omega.vercel.app/public/assets/school-seed.jpg">
  <title>Marketplace &amp; Auction House of Brooklyn New York</title>
  <link rel="canonical" href="https://the-school-omega.vercel.app/">
  <link rel="icon" href="public/assets/school-mark.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="public/assets/school-mark.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="Marketplace &amp; Auction House of Brooklyn New York, home">
      <img src="public/assets/school-mark.jpg" alt="" width="56" height="56">
      <span><strong>Marketplace &amp; Auction House</strong><small>of Brooklyn New York</small></span>
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#discover" data-nav="discover">Discover</a>
      <a href="#market" data-nav="market">Marketplace</a>
      <a href="#bazaar" data-nav="bazaar">Bazaar</a>
    </nav>

    <div class="topbar__actions">
      <a class="join-link" href="#join">Join</a>
      <a class="add-button" href="#sponsor"><span aria-hidden="true">+</span><span class="add-button__label">Add a piece</span></a>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="no-script">JavaScript is required to browse the marketplace.</p></noscript>
  </main>

  <footer class="footer">
    <a class="brand brand--footer" href="#home" aria-label="Marketplace &amp; Auction House of Brooklyn New York, home">
      <img src="public/assets/school-mark.jpg" alt="" width="48" height="48">
      <span><strong>Marketplace &amp; Auction House</strong><small>of Brooklyn New York</small></span>
    </a>
    <nav aria-label="Footer navigation">
      <a href="#discover">Discover</a>
      <a href="#market">Marketplace</a>
      <a href="#curators">Curators</a>
      <a href="#sponsor">Add a piece</a>
    </nav>
    <span>29 Nassau · Brooklyn</span>
  </footer>

  <dialog class="collect-dialog" id="collect-dialog" aria-labelledby="collect-title">
    <div class="dialog-card">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      <div id="collect-content"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
