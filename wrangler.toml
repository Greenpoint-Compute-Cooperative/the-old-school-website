# Cloudflare deployment for the founding-member site: a Worker that serves this
# directory as static files, no script. Live on theschool.nyc + www (custom
# domains, coop account, 2026-10-02); theoldschool.nyc is still GitHub Pages.
name = "the-old-school"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = true
routes = [
  { pattern = "theschool.nyc", custom_domain = true },
  { pattern = "www.theschool.nyc", custom_domain = true },
]

[assets]
directory = "."
html_handling = "auto-trailing-slash"
not_found_handling = "none"
