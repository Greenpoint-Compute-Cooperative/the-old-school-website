name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grove_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grove_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/grove_release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.3.2
      - run: npm ci
      - run: ./scripts/test-commerce-sql.sh
      - run: npm run ci
        env:
          FOUNDRY_PROFILE: ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Package static release
        run: |
          tar -czf brooklyn-marketplace-auction-house-static.tar.gz dist
          sha256sum brooklyn-marketplace-auction-house-static.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          brooklyn-marketplace-auction-house-static.tar.gz
          SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Marketplace & Auction House of Brooklyn $GITHUB_REF_NAME"
          --generate-notes
