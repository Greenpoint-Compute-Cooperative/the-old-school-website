name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Package static release
        run: |
          tar -czf brooklyn-marketplace-auction-house-static.tar.gz dist
          sha256sum brooklyn-marketplace-auction-house-static.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          brooklyn-marketplace-auction-house-static.tar.gz
          SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "Marketplace & Auction House $GITHUB_REF_NAME"
          --generate-notes
