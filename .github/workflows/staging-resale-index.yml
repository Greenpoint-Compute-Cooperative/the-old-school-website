name: Staging resale index

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-resale-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROVE_STAGING_CRON_SECRET: ${{ secrets.GROVE_STAGING_CRON_SECRET }}
    steps:
      - name: Reconcile finalized Sepolia ownership
        run: |
          if [ -z "$GROVE_STAGING_CRON_SECRET" ]; then
            echo "GROVE_STAGING_CRON_SECRET is not configured; staging index is intentionally skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GROVE_STAGING_CRON_SECRET" \
            https://the-school-sepolia.vercel.app/api/cron/resale-index
